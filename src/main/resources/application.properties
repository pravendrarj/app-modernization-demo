# Legacy Inventory Management System - Application Properties
# OUTDATED: Spring Boot 1.5.x style configuration

# Server config (no cloud profiles)
server.port=3010
server.context-path=/inventory

# OUTDATED: Spring Boot 1.5.x property names (changed in 2.x)
spring.datasource.url=jdbc:h2:mem:inventorydb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (SECURITY: enabled in production)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# OUTDATED: Hibernate 4.x properties
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# OUTDATED: Spring Boot 1.5.x property naming
spring.jpa.properties.hibernate.id.new_generator_mappings=false

# OUTDATED: JSP view configuration
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# OUTDATED: No actuator/health endpoints configured
# No cloud config (Azure/AWS)
# No distributed tracing
# No metrics export

# Mail configuration (hardcoded, not externalized)
mail.smtp.host=smtp.legacy-company.com
mail.smtp.port=25
notification.from=noreply@legacy-company.com

# OUTDATED: Logging config pointing to Log4j 1.x
# logging.config=classpath:log4j.xml

# OUTDATED: No connection pool optimization
spring.datasource.max-active=10
spring.datasource.max-idle=5
spring.datasource.min-idle=2
spring.datasource.initial-size=5

# OUTDATED: Jackson configuration (old property names)
spring.jackson.serialization.write-dates-as-timestamps=true
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# File upload (OUTDATED: Spring Boot 1.5 property names)
spring.http.multipart.enabled=true
spring.http.multipart.max-file-size=10MB
spring.http.multipart.max-request-size=10MB

# SECURITY: Debug mode enabled
debug=true
